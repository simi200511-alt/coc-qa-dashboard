<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoC QA Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<style>
:root{--tq:#33c0ca;--tq-d:#1f9aa3;--br:#b52324;--br-d:#961d1e;--bd:#e2e8f0;--tx:#334155}
body{font-family:'Prompt',sans-serif;background:#f1f5f9;color:var(--tx)}
.hero{background:linear-gradient(135deg,var(--tq) 0%,#1f9aa3 100%);color:#fff;padding:32px 0 70px;border-bottom:4px solid var(--br)}
.hero h1{font-size:1.6rem;font-weight:600;margin:0}
.hero p{margin:4px 0 0;opacity:.9;font-weight:300}
.wrap{margin-top:-46px}
.box{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 4px 14px rgba(15,23,42,.06);margin-bottom:22px}
.box-h{padding:16px 20px;border-bottom:1px solid var(--bd);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.box-b{padding:20px}
.form-label{font-size:.8rem;font-weight:500;color:#64748b;margin-bottom:5px}
.form-control,.form-select{border-radius:8px;border-color:#cbd5e1;font-size:.92rem}
.form-control:focus,.form-select:focus{border-color:var(--tq);box-shadow:0 0 0 3px rgba(51,192,202,.2)}
.btn-c{background:var(--br);color:#fff;border:0;border-radius:8px;font-weight:500}
.btn-c:hover{background:var(--br-d);color:#fff}
.btn-o{border:1px solid var(--bd);background:#fff;border-radius:8px;color:#64748b}
.kpi{padding:18px 20px;border-left:5px solid var(--tq);height:100%}
.kpi.red{border-left-color:var(--br)}
.kpi small{color:#64748b;font-weight:500}
.kpi .v{font-size:2rem;font-weight:600;line-height:1.2}
.ch{position:relative;height:340px}
#msg{display:none}
</style>
</head>
<body>
<div class="hero"><div class="container-fluid px-4">
  <h1>CoC QA Dashboard</h1>
  <p>ผลงานทางวิชาการของอาจารย์ วิทยาลัยการคอมพิวเตอร์</p>
</div></div>

<div class="container-fluid px-4 wrap">
  <div id="msg" class="alert alert-warning"></div>

  <div class="box"><div class="box-b">
    <div class="row g-3 align-items-end">
      <div class="col-6 col-md-2"><label class="form-label">ตั้งแต่ปี (ค.ศ.)</label><input type="number" id="startYear" class="form-control" placeholder="เช่น 2020"></div>
      <div class="col-6 col-md-2"><label class="form-label">ถึงปี (ค.ศ.)</label><input type="number" id="endYear" class="form-control" placeholder="เช่น 2024"></div>
      <div class="col-md-2"><label class="form-label">ชื่ออาจารย์</label><select id="staffF" class="form-select"><option value="All">-- ทุกคน --</option></select></div>
      <div class="col-md-2"><label class="form-label">หลักสูตร</label><select id="progF" class="form-select"><option value="All">-- ทั้งหมด --</option></select></div>
      <div class="col-md-2"><label class="form-label">ฐานข้อมูล (Indexing)</label><select id="idxF" class="form-select"><option value="All">-- ทั้งหมด --</option></select></div>
      <div class="col-md-2 d-flex gap-2">
        <button class="btn btn-c flex-fill" onclick="render()">ค้นหา</button>
        <button class="btn btn-o flex-fill" onclick="resetF()">ล้าง</button>
      </div>
    </div>
  </div></div>

  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3"><div class="box kpi mb-0"><small>ผลงานทั้งหมด</small><div class="v" id="k1">0</div></div></div>
    <div class="col-6 col-lg-3"><div class="box kpi red mb-0"><small>จำนวนอาจารย์</small><div class="v" id="k2">0</div></div></div>
    <div class="col-6 col-lg-3"><div class="box kpi mb-0"><small>เฉลี่ยต่อคน</small><div class="v" id="k3">0</div></div></div>
    <div class="col-6 col-lg-3"><div class="box kpi red mb-0"><small>ปีที่มีผลงานมากสุด</small><div class="v" id="k4">-</div></div></div>
  </div>

  <div class="row g-3">
    <div class="col-lg-8"><div class="box h-100">
      <div class="box-h">จำนวนผลงานรวมในแต่ละปี
        <select id="groupBy" class="form-select form-select-sm w-auto">
          <option value="none">ไม่แยก</option><option value="type">แยกตามประเภทผลงาน</option><option value="prog">แยกตามหลักสูตร</option>
        </select></div>
      <div class="box-b"><div class="ch"><canvas id="yearChart"></canvas></div></div>
    </div></div>
    <div class="col-lg-4"><div class="box h-100">
      <div class="box-h">สัดส่วนประเภทผลงาน</div>
      <div class="box-b"><div class="ch"><canvas id="typeChart"></canvas></div></div>
    </div></div>
    <div class="col-lg-6"><div class="box">
      <div class="box-h">จำนวนผลงานแยกตามหลักสูตร</div>
      <div class="box-b"><div class="ch"><canvas id="progChart"></canvas></div></div>
    </div></div>
    <div class="col-lg-6"><div class="box">
      <div class="box-h">Top 10 อาจารย์ที่มีผลงานมากสุด</div>
      <div class="box-b"><div class="ch"><canvas id="staffChart"></canvas></div></div>
    </div></div>
  </div>
</div>

<script>
// ===== 1) Endpoint หลังบ้าน (Vercel Serverless Function) ไม่มีลิงก์ข้อมูลอยู่ในโค้ดนี้ =====
const API_ENDPOINT = "/api/get-data";

// ===== 2) ชื่อคอลัมน์ในชีต (ถ้าชื่อไม่ตรง ให้เพิ่มชื่อในวงเล็บ) =====
const COL = {
  year:  ['Year','ปี'],
  staff: ['Staff name','ชื่ออาจารย์'],
  index: ['Indexing','ฐานข้อมูล'],
  type:  ['Type','ประเภท'],
  prog:  ['Program','Curriculum','หลักสูตร','Major']
};
const PAL=['#33c0ca','#b52324','#f59e0b','#3b82f6','#10b981','#8b5cf6','#ec4899','#64748b'];
Chart.defaults.font.family="'Prompt',sans-serif";

let DATA=[], CH={};
const $=id=>document.getElementById(id);
const pick=(r,ns)=>{for(const n of ns){if(r[n]!==undefined&&String(r[n]).trim()!=='')return String(r[n]).trim()}return ''};

function showMsg(t){$('msg').style.display='block';$('msg').textContent=t}
function demo(){
  const T=['International Journal Articles','International Proceedings','National Journal Articles','National Proceedings'],
        P=['CS','IT','DSA','CYB'],S=['อ.สมชาย','อ.สมหญิง','อ.วิชัย','อ.มานี','อ.ปิติ'],I=['Scopus','TCI','WoS'],o=[];
  for(let i=0;i<120;i++)o.push({year:2020+i%5,staff:S[i%5],index:I[i%3],type:T[(i*7)%4===3?2:i%2],prog:P[i%4]});
  return o;
}
function normalize(rows){
  if(rows.length&&Array.isArray(rows[0])){ // รองรับข้อมูลแบบ array ของ array (getValues)
    const h=rows[0].map(x=>String(x).trim());
    rows=rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])));
  }
  return rows.map(x=>{let y=parseInt(pick(x,COL.year));if(y>2400)y-=543;
    return{year:y,staff:pick(x,COL.staff),index:pick(x,COL.index),type:pick(x,COL.type),prog:pick(x,COL.prog)}})
    .filter(x=>x.year&&x.staff);
}
async function load(){
  try{
    const res=await fetch(API_ENDPOINT);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const text=await res.text();
    let rows;
    try{ // ลองอ่านเป็น JSON ก่อน ถ้าไม่ใช่ให้อ่านเป็น CSV
      const j=JSON.parse(text);
      if(typeof j!=='object')throw 0;
      rows=Array.isArray(j)?j:(j.data||j.rows||[]);
    }catch(_){
      rows=Papa.parse(text,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim()}).data;
    }
    DATA=normalize(rows);
    if(!DATA.length)throw new Error('empty');
  }catch(err){
    showMsg('โหลดข้อมูลจากเซิร์ฟเวอร์ไม่สำเร็จ กำลังแสดงข้อมูลตัวอย่าง (ตรวจสอบการตั้งค่า GOOGLE_SHEET_API_URL บน Vercel)');
    DATA=demo();
  }
  start();
}
function fill(id,key){
  const s=$(id);[...new Set(DATA.map(d=>d[key]))].filter(Boolean).sort().forEach(v=>s.add(new Option(v,v)));
}
function start(){
  fill('staffF','staff');fill('progF','prog');fill('idxF','index');
  $('groupBy').addEventListener('input',render);
  ['startYear','endYear'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')render()}));
  render();
}
function resetF(){['startYear','endYear'].forEach(i=>$(i).value='');['staffF','progF','idxF'].forEach(i=>$(i).value='All');render()}

const count=(arr,key)=>arr.reduce((o,d)=>{const k=d[key]||'ไม่ระบุ';o[k]=(o[k]||0)+1;return o},{});
function mk(id,cfg){if(CH[id])CH[id].destroy();CH[id]=new Chart($(id),cfg)}

function render(){
  const s=+$('startYear').value||0,e=+$('endYear').value||9999,
        st=$('staffF').value,pg=$('progF').value,ix=$('idxF').value;
  const f=DATA.filter(d=>d.year>=s&&d.year<=e&&(st==='All'||d.staff===st)&&(pg==='All'||d.prog===pg)&&(ix==='All'||d.index===ix));

  const yc=count(f,'year'),years=Object.keys(yc).sort();
  const people=new Set(f.map(d=>d.staff)).size;
  $('k1').textContent=f.length;$('k2').textContent=people;
  $('k3').textContent=people?(f.length/people).toFixed(1):0;
  $('k4').textContent=years.length?years.reduce((a,b)=>yc[a]>=yc[b]?a:b):'-';

  // กราฟแท่งรายปี (แยกกลุ่มได้)
  const g=$('groupBy').value;let ds;
  if(g==='none')ds=[{label:'จำนวนผลงาน',data:years.map(y=>yc[y]),backgroundColor:PAL[0],borderRadius:6}];
  else{const keys=[...new Set(f.map(d=>d[g]||'ไม่ระบุ'))].sort();
    ds=keys.map((k,i)=>({label:k,backgroundColor:PAL[i%PAL.length],borderRadius:3,
      data:years.map(y=>f.filter(d=>d.year==y&&(d[g]||'ไม่ระบุ')===k).length)}))}
  mk('yearChart',{type:'bar',data:{labels:years,datasets:ds},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:g!=='none',position:'bottom',labels:{usePointStyle:true}}},
    scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{precision:0},grid:{color:'#f1f5f9'}}}}});

  const tc=count(f,'type');
  mk('typeChart',{type:'doughnut',data:{labels:Object.keys(tc),datasets:[{data:Object.values(tc),backgroundColor:PAL,borderColor:'#fff',borderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true}}}}});

  const pc=count(f,'prog');
  mk('progChart',{type:'bar',data:{labels:Object.keys(pc),datasets:[{data:Object.values(pc),backgroundColor:PAL[1],borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{precision:0}}}}});

  const sc=Object.entries(count(f,'staff')).sort((a,b)=>b[1]-a[1]).slice(0,10);
  mk('staffChart',{type:'bar',data:{labels:sc.map(x=>x[0]),datasets:[{data:sc.map(x=>x[1]),backgroundColor:PAL[0],borderRadius:6}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{display:false}},x:{beginAtZero:true,ticks:{precision:0}}}}});
}
load();
</script>
</body>
</html>
